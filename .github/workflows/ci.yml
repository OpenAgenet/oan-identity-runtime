name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: OpenAgenet/oan-sdk-ts
          path: oan-sdk-ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: oan-sdk-ts
      - run: npm run build
        working-directory: oan-sdk-ts
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
